<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BTTF Pricing</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #0d0d0d;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 3rem 1rem;
    }
    .container { width: 100%; max-width: 540px; }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.25rem;
      letter-spacing: -0.5px;
    }
    .subtitle {
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    /* ── Cart rows ── */
    .cart {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 1.25rem;
    }
    .cart-row {
      display: flex;
      align-items: center;
      padding: 0.85rem 1rem;
      border-bottom: 1px solid #242424;
    }
    .cart-row:last-child { border-bottom: none; }
    .film-info { flex: 1; }
    .film-name { font-size: 0.95rem; font-weight: 500; }
    .film-price { font-size: 0.78rem; color: #666; margin-top: 0.1rem; }
    .qty-control {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .qty-btn {
      width: 30px;
      height: 30px;
      padding: 0;
      background: #2a2a2a;
      color: #f0f0f0;
      font-size: 1.1rem;
      font-weight: 600;
      border: 1px solid #3a3a3a;
      border-radius: 5px;
      cursor: pointer;
      line-height: 1;
    }
    .qty-btn:hover { background: #383838; }
    .qty-btn:disabled { color: #444; border-color: #2a2a2a; cursor: not-allowed; background: #1a1a1a; }
    .qty-value {
      min-width: 1.6rem;
      text-align: center;
      font-size: 1rem;
      font-weight: 600;
    }

    /* ── Calculate button ── */
    .calc-btn {
      width: 100%;
      padding: 0.75rem;
      background: #f5c518;
      color: #0d0d0d;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .calc-btn:hover { background: #e0b010; }
    .calc-btn:disabled { background: #555; color: #999; cursor: not-allowed; }

    /* ── Result ── */
    #result { margin-top: 2rem; }
    .total-box {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1rem;
    }
    .total-label { font-size: 0.85rem; color: #888; margin-bottom: 0.25rem; }
    .total-value { font-size: 2.2rem; font-weight: 700; color: #f5c518; }
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    .detail-item {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 0.75rem 1rem;
    }
    .detail-item .key { font-size: 0.75rem; color: #666; margin-bottom: 0.2rem; }
    .detail-item .val { font-size: 1.1rem; font-weight: 600; }
    .discount-highlight .val { color: #4caf50; }

    #error {
      margin-top: 1.5rem;
      background: #2a1010;
      border: 1px solid #6b2020;
      border-radius: 6px;
      padding: 0.75rem 1rem;
      color: #e57373;
      font-size: 0.9rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>BTTF Pricing</h1>
    <p class="subtitle">Back to the Future DVD bundle calculator</p>

    <div class="cart" id="cart"></div>

    <button class="calc-btn" id="btn" onclick="calculate()">Calculate</button>

    <div id="error"></div>
    <div id="result" style="display:none"></div>
  </div>

  <script>
    const CATALOG = [
      { name: "Back to the Future 1", price: "15€" },
      { name: "Back to the Future 2", price: "15€" },
      { name: "Back to the Future 3", price: "15€" },
      { name: "Other film",           price: "20€" },
    ];

    const quantities = Object.fromEntries(CATALOG.map(f => [f.name, 0]));

    function renderCart() {
      const cart = document.getElementById("cart");
      cart.innerHTML = CATALOG.map(film => `
        <div class="cart-row">
          <div class="film-info">
            <div class="film-name">${film.name}</div>
            <div class="film-price">${film.price} each</div>
          </div>
          <div class="qty-control">
            <button
              class="qty-btn"
              onclick="adjust('${film.name}', -1)"
              ${quantities[film.name] === 0 ? "disabled" : ""}
            >−</button>
            <span class="qty-value">${quantities[film.name]}</span>
            <button
              class="qty-btn"
              onclick="adjust('${film.name}', +1)"
            >+</button>
          </div>
        </div>
      `).join("");
    }

    function adjust(name, delta) {
      quantities[name] = Math.max(0, quantities[name] + delta);
      renderCart();
    }

    async function calculate() {
      const films = [];
      for (const film of CATALOG) {
        for (let i = 0; i < quantities[film.name]; i++) {
          films.push(film.name);
        }
      }

      const btn = document.getElementById("btn");
      const errorEl = document.getElementById("error");
      const resultEl = document.getElementById("result");

      errorEl.style.display = "none";
      resultEl.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Calculating…";

      try {
        const res = await fetch("/calculate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ films }),
        });

        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.detail || `HTTP ${res.status}`);
        }

        const data = await res.json();
        const d = data.detail;
        const discountPct = Math.round(d.discount_rate * 100);

        resultEl.innerHTML = `
          <div class="total-box">
            <div class="total-label">Total</div>
            <div class="total-value">${data.total.toFixed(2)} €</div>
          </div>
          <div class="detail-grid">
            <div class="detail-item">
              <div class="key">BTTF DVDs</div>
              <div class="val">${d.bttf_count}</div>
            </div>
            <div class="detail-item">
              <div class="key">Different volumes</div>
              <div class="val">${d.bttf_different}</div>
            </div>
            <div class="detail-item ${discountPct > 0 ? "discount-highlight" : ""}">
              <div class="key">Discount</div>
              <div class="val">${discountPct > 0 ? "-" : ""}${discountPct}%</div>
            </div>
            <div class="detail-item">
              <div class="key">Other films</div>
              <div class="val">${d.other_count}</div>
            </div>
          </div>
        `;
        resultEl.style.display = "block";
      } catch (err) {
        errorEl.textContent = "Error: " + err.message;
        errorEl.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Calculate";
      }
    }

    renderCart();
  </script>
</body>
</html>

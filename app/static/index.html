<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BTTF Pricing</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #0d0d0d;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 3rem 1rem;
    }
    .container { width: 100%; max-width: 540px; }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.25rem;
      letter-spacing: -0.5px;
    }
    .subtitle {
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 0.5rem;
    }
    textarea {
      width: 100%;
      height: 140px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 6px;
      color: #f0f0f0;
      font-size: 0.95rem;
      padding: 0.75rem;
      resize: vertical;
      outline: none;
    }
    textarea:focus { border-color: #555; }
    .hint {
      font-size: 0.78rem;
      color: #666;
      margin-top: 0.4rem;
      margin-bottom: 1.25rem;
    }
    button {
      width: 100%;
      padding: 0.75rem;
      background: #f5c518;
      color: #0d0d0d;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #e0b010; }
    button:disabled { background: #555; color: #999; cursor: not-allowed; }

    #result { margin-top: 2rem; }
    .total-box {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1rem;
    }
    .total-label { font-size: 0.85rem; color: #888; margin-bottom: 0.25rem; }
    .total-value { font-size: 2.2rem; font-weight: 700; color: #f5c518; }
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    .detail-item {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 0.75rem 1rem;
    }
    .detail-item .key { font-size: 0.75rem; color: #666; margin-bottom: 0.2rem; }
    .detail-item .val { font-size: 1.1rem; font-weight: 600; }
    .discount-highlight .val { color: #4caf50; }

    #error {
      margin-top: 1.5rem;
      background: #2a1010;
      border: 1px solid #6b2020;
      border-radius: 6px;
      padding: 0.75rem 1rem;
      color: #e57373;
      font-size: 0.9rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>BTTF Pricing</h1>
    <p class="subtitle">Back to the Future DVD bundle calculator</p>

    <label for="films">Films (one per line)</label>
    <textarea
      id="films"
      placeholder="Back to the Future 1&#10;Back to the Future 2&#10;Back to the Future 3"
    ></textarea>
    <p class="hint">Film names are case-sensitive. BTTF DVDs: 15€ each. Others: 20€ each.</p>

    <button id="btn" onclick="calculate()">Calculate</button>

    <div id="error"></div>
    <div id="result" style="display:none"></div>
  </div>

  <script>
    async function calculate() {
      const raw = document.getElementById("films").value;
      const films = raw.split("\n").map(s => s.trim()).filter(s => s.length > 0);

      const btn = document.getElementById("btn");
      const errorEl = document.getElementById("error");
      const resultEl = document.getElementById("result");

      errorEl.style.display = "none";
      resultEl.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Calculating…";

      try {
        const res = await fetch("/calculate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ films }),
        });

        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.detail || `HTTP ${res.status}`);
        }

        const data = await res.json();
        const d = data.detail;
        const discountPct = Math.round(d.discount_rate * 100);

        resultEl.innerHTML = `
          <div class="total-box">
            <div class="total-label">Total</div>
            <div class="total-value">${data.total.toFixed(2)} €</div>
          </div>
          <div class="detail-grid">
            <div class="detail-item">
              <div class="key">BTTF DVDs</div>
              <div class="val">${d.bttf_count}</div>
            </div>
            <div class="detail-item">
              <div class="key">Different volumes</div>
              <div class="val">${d.bttf_different}</div>
            </div>
            <div class="detail-item ${discountPct > 0 ? 'discount-highlight' : ''}">
              <div class="key">Discount</div>
              <div class="val">${discountPct > 0 ? '-' : ''}${discountPct}%</div>
            </div>
            <div class="detail-item">
              <div class="key">Other films</div>
              <div class="val">${d.other_count}</div>
            </div>
          </div>
        `;
        resultEl.style.display = "block";
      } catch (err) {
        errorEl.textContent = "Error: " + err.message;
        errorEl.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Calculate";
      }
    }
  </script>
</body>
</html>
